name: Build app

# A push to `deployment` (or a dashboard request) builds a signed APK you can
# download. Nothing reaches Google Play unless you run this by hand from the
# Actions tab and pick deliver = playstore.
on:
  push:
    branches: [deployment]
  workflow_dispatch:
    inputs:
      deliver:
        description: apk = downloadable APK only; playstore = also upload to Google Play
        type: choice
        options: [apk, playstore]
        default: apk
      track:
        description: Play Store track (only used when deliver = playstore)
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      business_name:
        description: Business name, shown as the app name (blank keeps the default)
        type: string
        default: ''
      domain:
        description: Backend domain, e.g. shop.example.com (blank keeps the default)
        type: string
        default: ''
      theme_color:
        description: Theme colour as #RRGGBB (blank keeps the default)
        type: string
        default: ''
      phone:
        description: Contact phone
        type: string
        default: ''
      email:
        description: Contact email
        type: string
        default: ''
      location:
        description: Business location
        type: string
        default: ''
      package_id:
        description: Android package ID, e.g. com.mahesh (blank keeps com.ekart360vendor). For Play, the app must already exist in Play Console.
        type: string
        default: ''
      logo_base64:
        description: Business logo, a PNG as base64 (blank keeps the default)
        type: string
        default: ''

concurrency:
  group: build-app
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # lets the job record each Play release as a git tag
    env:
      DELIVER: ${{ inputs.deliver || 'apk' }}
      PACKAGE_ID: ${{ inputs.package_id || 'com.ekart360vendor' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the release tags below are the version counter

      # The package ID is typed by a person and ends up in tag names and the Play
      # upload, so check it (and the other fields) before anything uses it.
      - name: Validate inputs
        run: node scripts/dashboard-config.js --validate-only
        env:
          BUSINESS_NAME: ${{ inputs.business_name }}
          DOMAIN: ${{ inputs.domain }}
          THEME_COLOR: ${{ inputs.theme_color }}
          PHONE: ${{ inputs.phone }}
          EMAIL: ${{ inputs.email }}
          LOCATION: ${{ inputs.location }}
          LOGO_BASE64: ${{ inputs.logo_base64 }}

      # Name (what people see): the next number after the highest release tag for
      # this package, release/<package>/1.1 -> 1.2 -> 1.3, so each app counts on its
      # own. To jump to 2.0, push the tag release/<package>/2.0 yourself. Only a
      # successful Play upload creates a tag, so an APK-only run previews the
      # upcoming name without using it up.
      # Code (hidden integer Play needs): minutes since 2026-01-01 UTC (1767225600),
      # so it only ever rises whatever was uploaded before. Builds are serialised,
      # so two never share a minute.
      - name: Compute version
        run: |
          code=$(( ($(date -u +%s) - 1767225600) / 60 ))
          latest=$(git tag -l "release/$PACKAGE_ID/[0-9]*.[0-9]*" | sed "s#^release/$PACKAGE_ID/##" | sort -V | tail -1)
          if [ -z "$latest" ]; then
            name="1.1"   # the first Play upload by hand counted as 1.0
          else
            name="${latest%.*}.$(( ${latest##*.} + 1 ))"
          fi
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "::notice title=Version::${name} (code ${code})"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Apply dashboard config
        run: node scripts/dashboard-config.js
        env:
          BUSINESS_NAME: ${{ inputs.business_name }}
          DOMAIN: ${{ inputs.domain }}
          THEME_COLOR: ${{ inputs.theme_color }}
          PHONE: ${{ inputs.phone }}
          EMAIL: ${{ inputs.email }}
          LOCATION: ${{ inputs.location }}
          LOGO_BASE64: ${{ inputs.logo_base64 }}

      - name: Generate launcher icons from the logo
        if: ${{ inputs.logo_base64 != '' }}
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          res=android/app/src/main/res
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=$res/mipmap-${pair%%:*}; px=${pair##*:}
            for name in ic_launcher ic_launcher_round; do
              $IM build-logo.png -background white -gravity center -resize ${px}x${px} -extent ${px}x${px} "$dir/$name.png"
            done
          done

      - name: Restore upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # Download-only: an arm64 APK, which covers current phones and builds fast.
      # Play: the bundle for every architecture (no device is dropped), plus an
      # APK from the same build so it can be downloaded too. That APK carries all
      # architectures, so it is larger than the arm64-only one.
      - name: Build signed release
        working-directory: android
        run: |
          chmod +x gradlew
          if [ "$DELIVER" = "playstore" ]; then
            TASKS="bundleRelease assembleRelease"
            ARCH=armeabi-v7a,arm64-v8a,x86,x86_64
          else
            TASKS="assembleRelease"
            ARCH=arm64-v8a
          fi
          ./gradlew $TASKS --no-daemon \
            -PreactNativeArchitectures="$ARCH" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PMYAPP_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.keystore" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
        env:
          ORG_GRADLE_PROJECT_APP_NAME: ${{ inputs.business_name }}
          ORG_GRADLE_PROJECT_APPLICATION_ID: ${{ env.PACKAGE_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK for download
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload bundle artifact
        if: ${{ env.DELIVER == 'playstore' }}
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        if: ${{ env.DELIVER == 'playstore' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_ID }}
          releaseName: ${{ env.VERSION_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'production' }}
          status: completed

      - name: Record the released version
        if: ${{ env.DELIVER == 'playstore' }}
        run: git tag "release/$PACKAGE_ID/$VERSION_NAME" && git push origin "release/$PACKAGE_ID/$VERSION_NAME"
