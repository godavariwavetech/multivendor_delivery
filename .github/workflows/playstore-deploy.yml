name: Deploy to Play Store

on:
  push:
    branches: [deployment]
  workflow_dispatch:
    inputs:
      track:
        description: Play Store track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      business_name:
        description: Business name, shown as the app name (blank keeps the default)
        type: string
        default: ''
      domain:
        description: Backend domain, e.g. shop.example.com (blank keeps the default)
        type: string
        default: ''
      theme_color:
        description: Theme colour as #RRGGBB (blank keeps the default)
        type: string
        default: ''
      phone:
        description: Contact phone
        type: string
        default: ''
      email:
        description: Contact email
        type: string
        default: ''
      location:
        description: Business location
        type: string
        default: ''
      logo_base64:
        description: Business logo, a PNG as base64 (blank keeps the default)
        type: string
        default: ''

concurrency:
  group: playstore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Offset keeps versionCode above anything already uploaded by hand.
      VERSION_CODE_OFFSET: 100
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        run: |
          echo "VERSION_CODE=$(( GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET ))" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JS dependencies
        run: npm ci

      - name: Apply dashboard config
        run: node scripts/dashboard-config.js
        env:
          BUSINESS_NAME: ${{ inputs.business_name }}
          DOMAIN: ${{ inputs.domain }}
          THEME_COLOR: ${{ inputs.theme_color }}
          PHONE: ${{ inputs.phone }}
          EMAIL: ${{ inputs.email }}
          LOCATION: ${{ inputs.location }}
          LOGO_BASE64: ${{ inputs.logo_base64 }}

      - name: Generate launcher icons from the logo
        if: ${{ inputs.logo_base64 != '' }}
        run: |
          sudo apt-get install -y imagemagick >/dev/null
          IM=$(command -v magick || command -v convert)
          res=android/app/src/main/res
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            dir=$res/mipmap-${pair%%:*}; px=${pair##*:}
            for name in ic_launcher ic_launcher_round; do
              $IM build-logo.png -background white -gravity center -resize ${px}x${px} -extent ${px}x${px} "$dir/$name.png"
            done
          done

      - name: Restore upload keystore
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build signed release bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -PVERSION_CODE="$VERSION_CODE" \
            -PVERSION_NAME="$VERSION_NAME" \
            -PMYAPP_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.keystore" \
            -PMYAPP_UPLOAD_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD" \
            -PMYAPP_UPLOAD_KEY_ALIAS="$ANDROID_KEY_ALIAS" \
            -PMYAPP_UPLOAD_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
        env:
          ORG_GRADLE_PROJECT_APP_NAME: ${{ inputs.business_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ekart360vendor
          releaseName: ${{ env.VERSION_NAME }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed
